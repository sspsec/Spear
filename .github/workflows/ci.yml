name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Spear X/frontend/package-lock.json

      - name: Build frontend
        working-directory: Spear X/frontend
        run: npm ci && npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Spear X/go.mod

      - name: Test Go application
        working-directory: Spear X
        run: go test ./...
